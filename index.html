<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Gün içinde yetiştireceğim</title>
  <meta name="description" content="Gün içinde yetiştireceğim">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; color: #f4f4f4; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      font-family: Arial, Helvetica, sans-serif;
    }
    main { width: min(100%, 760px); text-align: center; }
    img {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: 82vh;
      height: auto;
      object-fit: contain;
      margin: 0 auto;
    }
    h1 {
      margin: 18px 0 0;
      font-size: clamp(17px, 3vw, 24px);
      font-weight: 500;
      letter-spacing: .06em;
    }
  </style>
</head>
<body>
  <main>
    <img src="image.jpg" alt="Köpeğin bilgisayarın arkasından baktığı görsel">
  
  </main>
</body>
</html>
